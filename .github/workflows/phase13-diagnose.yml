name: Phase 13 diagnose

on:
  push:
    branches: [ "feature/phase-13-shared-map-processing" ]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-13-shared-map-processing
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm ci --no-audit --no-fund
      - name: Capture typecheck
        run: npm run typecheck > phase13-typecheck.txt 2>&1 || true
      - name: Commit diagnostic output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add phase13-typecheck.txt
          git commit -m 'Capture Phase 13 typecheck diagnostics'
          git push origin HEAD:feature/phase-13-shared-map-processing
