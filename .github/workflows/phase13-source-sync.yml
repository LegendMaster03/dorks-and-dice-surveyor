name: Phase 13 source sync

on:
  push:
    branches: [ "feature/phase-13-shared-map-processing" ]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-13-shared-map-processing
          fetch-depth: 0
      - name: Copy exact legacy detector and parity fixture
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/LegendMaster03/dorks-and-dice-hex-crawl.git "$RUNNER_TEMP/hex-crawl"
          git -C "$RUNNER_TEMP/hex-crawl" checkout --quiet 2dfc4d999ad1b7b36701faac210b2e7d9beedd60
          mkdir -p src/analysis/hex-grid test
          cp "$RUNNER_TEMP/hex-crawl/src/HexCrawl.Web/Client/src/grid-lattice-detector.ts" src/analysis/hex-grid/detector.ts
          cp "$RUNNER_TEMP/hex-crawl/src/HexCrawl.Web/Client/test/grid-lattice-detector.test.mjs" test/detector-parity.test.mjs
          sed -i 's#../.test-dist/grid-lattice-detector.js#../dist/src/analysis/hex-grid/detector.js#' test/detector-parity.test.mjs
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit extracted baseline
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/analysis/hex-grid/detector.ts test/detector-parity.test.mjs package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Extract legacy hex lattice detector baseline'
          git push origin HEAD:feature/phase-13-shared-map-processing
