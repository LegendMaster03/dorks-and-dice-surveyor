name: Validate Surveyor

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: validate-surveyor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run typecheck && npm run build
      - name: Detector, encoded-image, API, auth, resource, worker, cancellation, and contract tests
        run: npm test
      - name: Build container
        run: docker build -t dorks-and-dice-surveyor:test .
      - name: Container liveness, readiness, and analysis smoke
        run: |
          set -euo pipefail
          token='ci-surveyor-token-1234567890'
          docker run -d --name surveyor-smoke -p 127.0.0.1:18094:8080 \
            -e "SURVEYOR_SERVICE_TOKEN=$token" \
            -e 'SURVEYOR_WORKER_COUNT=2' \
            -e 'SURVEYOR_QUEUE_LIMIT=2' \
            dorks-and-dice-surveyor:test >/dev/null
          trap 'docker rm -f surveyor-smoke >/dev/null 2>&1 || true' EXIT
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:18094/health/live >/dev/null \
              && curl -fsS http://127.0.0.1:18094/health/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18094/health/live | grep -q '"status":"live"'
          curl -fsS http://127.0.0.1:18094/health/ready | grep -q '"status":"ready"'
          node --input-type=module - <<'NODE'
          import sharp from 'sharp';
          await sharp({ create: { width: 96, height: 96, channels: 3, background: 'white' } }).png().toFile('/tmp/surveyor-smoke.png');
          NODE
          curl -fsS -X POST 'http://127.0.0.1:18094/v1/hex-grid/detect?minimumConfidence=0.54' \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: image/png' \
            --data-binary '@/tmp/surveyor-smoke.png' \
            -o /tmp/surveyor-analysis.json
          python3 - <<'PY'
          import json
          value=json.load(open('/tmp/surveyor-analysis.json'))
          assert value['apiVersion']=='v1', value
          assert value['capability']=='map.hex-grid.detect', value
          assert value['status'] in ('detected','inconclusive','gridless'), value
          assert value['source']['mediaType']=='image/png', value
          PY
